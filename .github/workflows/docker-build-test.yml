name: Docker Build Test

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-test.yml'
      - 'start.sh'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-test.yml'
      - 'start.sh'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: dps-backend:test
        load: true
        # Use GitHub Actions cache with better configuration
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Build arguments for better caching
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        # Use buildx features for better performance
        platforms: linux/amd64
        
    - name: Test image exists
      run: docker images dps-backend:test
      
    - name: Start container and test API
      run: |
        # Start container in background with database migration and secret key
        docker run -d --name test-container -p 3000:3000 \
          -e DPS_AUTH_API_SESSION_SECRET="12345678901234567890123456789012" \
          dps-backend:test
        
        # Wait for server to start and test health endpoint (max 30 seconds)
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/health > /dev/null 2>&1; then
            echo "Server started successfully and health endpoint is responding!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start or health endpoint not responding within 30 seconds"
            docker logs test-container
            exit 1
          fi
          sleep 1
        done
        
    - name: Cleanup container
      if: always()
      run: |
        docker stop test-container || true
        docker rm test-container || true