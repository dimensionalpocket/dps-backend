name: Rust Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.99.0
        
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # Include Cargo.lock in cache key
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        # Cache target directory and registry
        cache-targets: true
        cache-all-crates: true
        # Save cache even on failure
        save-if: true
        
    - name: Run tests
      run: cargo test --verbose